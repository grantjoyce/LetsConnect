<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let's Connect</title>
<meta name="description" content="Questions for couples, one card at a time.">

<meta name="theme-color" content="#11141B">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Let's Connect">

<link rel="manifest" href="/manifest.webmanifest">
<!-- Served by the app, not from disk: /api/brand/favicon returns the uploaded
     favicon and falls back to the built-in one, so this is correct before
     app.js has run and on an install that has uploaded nothing. The static
     /icons/*.png files these used to name are not reliably reaching the
     server, which is what left the installed app with no icon at all. -->
<link rel="icon" href="/api/brand/favicon">
<link rel="apple-touch-icon" href="/api/brand/favicon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
</head>
<body>

<div id="app" class="app">
  <div class="boot">
    <div class="boot-mark" aria-hidden="true"></div>
    <p class="boot-text">Loading&hellip;</p>
  </div>
</div>

<noscript>
  <p style="padding:2rem;font-family:system-ui;color:#E9E4DA;background:#11141B">
    Let's Connect needs JavaScript switched on.
  </p>
</noscript>

<script>
// Cache-busting loader.
//
// A deploy that the browser refuses to pick up is the most persistent class of
// bug this stack produces: the new HTML arrives, the old app.js is reused from
// cache, and it looks exactly like the fix was never shipped. Appending a
// timestamp makes every page load request a URL the cache has never seen.
(function () {
  var v = Date.now();
  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = '/styles.css?v=' + v;
  document.head.appendChild(css);

  var js = document.createElement('script');
  js.src = '/app.js?v=' + v;
  js.defer = true;
  document.body.appendChild(js);
})();

// The service worker is what makes this installable and usable offline.
//
// NOT on localhost, deliberately. Two reasons, both about development rather
// than about the worker being wrong:
//
//   1. It is the stickiest cache in the stack. Everything else here already
//      fights staleness - the ?v= buster above, no-store on /api - because
//      testing against code that is not the code you just wrote has cost real
//      hours on this project. A worker that serves a cached shell is that
//      failure with a longer half-life.
//   2. Under tooling that proxies the page, fetch() inside the worker can fail
//      while the page's own fetch works. Every /api/ GET then comes back as the
//      worker's 503 "You are offline" and the app reads that as logged out, so
//      it drops to the sign-in screen on every reload while the session is
//      perfectly valid. That is a debugging trap, not a real symptom.
//
// Production is untouched: the worker installs on the deployed host exactly as
// before, so installability and offline use are unchanged. An install left over
// from a previous localhost session is actively removed, otherwise this guard
// does nothing for the one browser that most needs it.
(function () {
  if (!('serviceWorker' in navigator)) return;

  var host = location.hostname;
  var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '::1' || host === '';

  if (isLocal) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
    return;
  }

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function (err) {
      console.warn('Service worker registration failed:', err);
    });
  });
})();
</script>

</body>
</html>
